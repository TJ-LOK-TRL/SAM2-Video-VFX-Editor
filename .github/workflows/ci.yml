name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '**.md'
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tj-lok-trl
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - uses: docker/setup-qemu-action@v4
        name: Set up QEMU

      - uses: docker/setup-buildx-action@v4
        name: Set up Docker Buildx

      - uses: docker/build-push-action@v4
        name: Build and push backend
        with:
          platforms: linux/amd64,linux/arm64
          context: ./backend
          push: true
          tags: ghcr.io/tj-lok-trl/bci-explorer/backend:latest

      - uses: docker/build-push-action@v4
        name: Build and push worker
        with:
          platforms: linux/amd64,linux/arm64
          context: ./worker
          push: true
          tags: ghcr.io/tj-lok-trl/bci-explorer/worker:latest

      - uses: docker/build-push-action@v4
        name: Build and push frontend
        with:
          platforms: linux/amd64,linux/arm64
          context: ./frontend
          push: true
          tags: ghcr.io/tj-lok-trl/bci-explorer/frontend:latest

      - uses: docker/build-push-action@v4
        name: Build and push cloudflared
        with:
          platforms: linux/amd64,linux/arm64
          context: ./cloudflared
          push: true
          tags: ghcr.io/tj-lok-trl/bci-explorer/cloudflared:latest