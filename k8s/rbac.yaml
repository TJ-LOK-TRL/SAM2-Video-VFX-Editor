apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: sam2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-role
  namespace: sam2
rules:
  - apiGroups: ["", "batch", "apps", "extensions"]
    resources: ["pods", "pods/log", "jobs", "deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-rb
  namespace: sam2
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: sam2
roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io
