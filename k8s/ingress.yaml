apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sam2-ingress
  namespace: sam2
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
